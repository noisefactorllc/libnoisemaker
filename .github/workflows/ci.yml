name: CI

on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "docs/**", "LICENSE"]
  schedule:
    - cron: '17 4 * * 0'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    name: scripts/test in the pinned Debian toolchain
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    # Runs scripts/test in a pinned Debian bookworm toolchain: the base image digest
    # below, and from its packages the compiler, CMake and Python (GCC 12, CMake 3.25,
    # Python 3.11 as python3 and a uv-managed Python 3.13). It runs as root.
    container: node:26-bookworm-slim@sha256:9e6f9357d371591e32ab6f2d8a26d63bdd0d17c29eee3f4f3e7e454d9634bf73
    env:
      UV_PYTHON_DOWNLOADS: never
      UV_PYTHON_INSTALL_DIR: /opt/python
    steps:
      - name: Install the pinned toolchain
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates git python3 python3-dev \
            build-essential pkg-config cmake curl
          curl -fsSLo /tmp/uv.tar.gz https://github.com/astral-sh/uv/releases/download/0.11.6/uv-x86_64-unknown-linux-gnu.tar.gz
          echo "0c6bab77a67a445dc849ed5e8ee8d3cb333b6e2eba863643ce1e228075f27943  /tmp/uv.tar.gz" | sha256sum -c -
          tar -xzf /tmp/uv.tar.gz -C /usr/local/bin --strip-components=1
          UV_PYTHON_DOWNLOADS=manual uv python install --no-bin 3.13.13
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/catalog
          key: catalog-${{ hashFiles('parity/reference.json') }}
      - name: Unit tests and parity gates
        run: scripts/test

  core-macos13:
    name: core for macOS 13.0, warnings as errors
    if: github.event_name != 'schedule'
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "26"
      - name: Install macOS packages
        run: brew install ninja
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/catalog
          key: catalog-${{ hashFiles('parity/reference.json') }}
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DNM_BUILD_GPU=OFF -DCMAKE_OSX_DEPLOYMENT_TARGET=13.0 -DNM_WARNINGS_AS_ERRORS=ON
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        run: ctest --test-dir build --output-on-failure

  build:
    name: ${{ matrix.name }}
    if: github.event_name != 'schedule'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-x64,       os: ubuntu-24.04,     generator: Ninja }
          - { name: linux-arm64,     os: ubuntu-24.04-arm, generator: Ninja }
          - { name: windows-x64,     os: windows-2025,     generator: "Visual Studio 18 2026", arch: x64 }
          - { name: windows-arm64,   os: windows-11-arm,   generator: "Visual Studio 18 2026", arch: ARM64 }
          - { name: macos-arm64,     os: macos-15,         generator: Ninja, osx_arch: arm64 }
          - { name: macos-x86_64,    os: macos-15,         generator: Ninja, osx_arch: x86_64 }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    env:
      NM_ALLOW_FALLBACK_ADAPTER: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "26"
      - name: Install CMake for Visual Studio 2026
        if: runner.os == 'Windows'
        run: |
          python -m pip install cmake==4.4.4
          python -m cmake --version
      - name: Verify the Visual Studio 2026 CMake requirement
        if: matrix.name == 'windows-x64'
        shell: python
        run: |
          import os, pathlib, subprocess, sys
          root = pathlib.Path(os.environ["RUNNER_TEMP"]) / "cmake-generator-probe"
          older = root / "older"
          subprocess.run([sys.executable, "-m", "pip", "install", "--target", str(older),
                          "cmake==3.31.6"], check=True)
          cmake = older / "cmake" / "data" / "bin" / "cmake.exe"
          subprocess.run([str(cmake), "--version"], check=True)
          args = ["-S", ".", "-G", "Visual Studio 18 2026", "-A", "x64", "-DNM_BUILD_GPU=OFF"]
          command = [str(cmake), *args, "-B", str(root / "unsupported")]
          print(subprocess.list2cmdline(command), flush=True)
          result = subprocess.run(command, stdout=subprocess.PIPE, stderr=subprocess.STDOUT, text=True)
          print(result.stdout, flush=True)
          print(f"CMake 3.31.6 configure exit: {result.returncode}", flush=True)
          if result.returncode == 0 or "Could not create named generator Visual Studio 18 2026" not in result.stdout:
              raise SystemExit("CMake below 4.2 did not reject the unsupported generator as expected")
          command = [sys.executable, "-m", "cmake", *args, "-B", str(root / "supported")]
          print(subprocess.list2cmdline(command), flush=True)
          result = subprocess.run(command)
          print(f"CMake 4.4.4 configure exit: {result.returncode}", flush=True)
          result.check_returncode()
      - name: Install Linux packages
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ninja-build mesa-vulkan-drivers libvulkan1
      - name: Install macOS packages
        if: runner.os == 'macOS'
        run: brew install ninja
      # Hosted runners export ImageVersion; the env context does not carry it into cache keys.
      - name: Read the runner image version
        id: image
        shell: bash
        run: echo "version=$ImageVersion" >> "$GITHUB_OUTPUT"
      # A prebuilt Dawn per leg, rebuilt when the lock, its options, its build tool or the
      # runner image (and with it the compiler) changes.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: dawn-install
        with:
          path: .cache/dawn-install
          key: dawn-install-${{ matrix.name }}-${{ steps.image.outputs.version }}-${{ hashFiles('third_party/dawn.lock.json', 'cmake/DawnOptions.cmake', 'tools/build_dawn.py') }}
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: steps.dawn-install.outputs.cache-hit != 'true'
        with:
          path: .cache/dawn
          key: dawn-src-${{ hashFiles('third_party/dawn.lock.json') }}
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/catalog
          key: catalog-${{ hashFiles('parity/reference.json') }}
      - name: Tool tests
        run: python -m unittest discover -v -s tests/tools -t .
      - name: Fetch Dawn
        if: steps.dawn-install.outputs.cache-hit != 'true'
        run: python tools/fetch_dawn.py
      - name: Build Dawn
        if: steps.dawn-install.outputs.cache-hit != 'true'
        shell: bash
        run: |
          args=(--prefix .cache/dawn-install --generator "${{ matrix.generator }}")
          if [ -n "${{ matrix.arch }}" ]; then args+=(--arch "${{ matrix.arch }}"); fi
          if [ -n "${{ matrix.osx_arch }}" ]; then args+=(--osx-arch "${{ matrix.osx_arch }}"); fi
          if [ "$RUNNER_OS" = Windows ]; then
            args+=(--cmake "$(python -c 'import cmake, os; print(os.path.join(cmake.CMAKE_BIN_DIR, "cmake"))')")
          fi
          python tools/build_dawn.py "${args[@]}"
      - name: Configure
        shell: bash
        run: |
          args=(-S . -B build -G "${{ matrix.generator }}" -DCMAKE_BUILD_TYPE=Release)
          args+=("-DNM_DAWN_PREBUILT_DIR=$PWD/.cache/dawn-install")
          if [ -n "${{ matrix.arch }}" ]; then args+=(-A "${{ matrix.arch }}"); fi
          if [ -n "${{ matrix.osx_arch }}" ]; then args+=("-DCMAKE_OSX_ARCHITECTURES=${{ matrix.osx_arch }}"); fi
          if [ "$RUNNER_OS" = Windows ]; then
            python -m cmake "${args[@]}"
          else
            cmake "${args[@]}"
          fi
      - name: Build
        shell: bash
        run: |
          if [ "$RUNNER_OS" = Windows ]; then
            python -m cmake --build build --config Release --parallel
          else
            cmake --build build --config Release --parallel
          fi
      - name: Test
        if: matrix.osx_arch != 'x86_64'
        run: ctest --test-dir build --build-config Release --output-on-failure
      - name: Test under Rosetta
        if: matrix.osx_arch == 'x86_64'
        run: |
          arch -x86_64 /usr/bin/true
          ctest --test-dir build --build-config Release --output-on-failure
      - name: Report adapter
        run: ctest --test-dir build --build-config Release -R '^test_device$' -V
